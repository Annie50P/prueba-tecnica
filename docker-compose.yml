services:
  neo4j:
    image: neo4j:5.22.0
    container_name: neo4j
    ports:
      - "7474:7474"   # Neo4j browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 90s

  graphiti:
    image: zepai/graphiti:latest
    container_name: graphiti
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Servidor MCP oficial de Graphiti (help.getzep.com/v3/graphiti/getting-started/mcp-server).
  # Expone las tools: add_episode, search_nodes, search_facts, get_episodes,
  # get_entity_edge, delete_entity_edge, delete_episode, clear_graph, get_status.
  # Transporte HTTP (Streamable HTTP) en /mcp/; puerto 8020 para no colisionar con graphiti REST.
  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:latest
    container_name: graphiti-mcp
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${GRAPHITI_MCP_PORT:-8020}:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL_NAME=${MCP_MODEL_NAME:-gpt-4o-mini}
      - LLM_PROVIDER=${MCP_LLM_PROVIDER:-openai}
      - EMBEDDER_PROVIDER=${MCP_EMBEDDER_PROVIDER:-openai}
      - DATABASE_PROVIDER=${MCP_DATABASE_PROVIDER:-neo4j}
      - MCP_TRANSPORT=http
      - SEMAPHORE_LIMIT=${MCP_SEMAPHORE_LIMIT:-10}
      - GRAPHITI_TELEMETRY_ENABLED=false
    command:
      - "--transport"
      - "http"
      - "--database-provider"
      - "${MCP_DATABASE_PROVIDER:-neo4j}"
      - "--group-id"
      - "${MCP_GROUP_ID:-prueba-tecnica}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  ingesta:
    build:
      context: ./ingesta
      dockerfile: Dockerfile
    container_name: ingesta
    depends_on:
      graphiti:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GRAPHITI_DB_PATH=/app/ingesta/local_graph.db
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-prueba-tecnica}
      # OPENAI_API_KEY necesario para la ingesta de episodios semánticos via Graphiti.
      # Sin clave los nodos de dominio se escriben igual; solo se omiten los episodios.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/data:ro
      - ./ingesta:/app/ingesta
    command: python ingest.py

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      graphiti:
        condition: service_healthy
      graphiti-mcp:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - GRAPHITI_URL=http://graphiti:8000
      - GRAPHITI_MCP_URL=http://graphiti-mcp:8000/mcp
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-prueba-tecnica}
      # sqlite = usa local_graph.db (data activa). Cambiar a 'graphiti' cuando
      # Neo4j esté hidratado y graphiti-core esté instalado en la imagen.
      - GRAPH_BACKEND=graphiti
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - API_PORT=8001
    volumes:
      - ./ingesta:/app/ingesta
      - ./api:/app/api
    command: uvicorn api.main:app --reload --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  neo4j_data:
